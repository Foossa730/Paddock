<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paddock — Voitures de sport</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23e4002b'/><path d='M7 20h18l-2-5-4-2h-6l-4 3z' fill='white'/><circle cx='11' cy='21' r='2.5' fill='white'/><circle cx='21' cy='21' r='2.5' fill='white'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>Paddock</h1>
        <p class="brand-sub">Catalogue des voitures de sport</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="etat-api" class="etat" title="État de l'API">
        <span class="etat-point"></span><span class="etat-texte">Connexion…</span>
      </span>
      <a href="/rapports" class="btn btn-secondaire" target="_blank" rel="noopener">Rapports k6</a>
      <button id="btn-ajouter" class="btn btn-primaire" type="button">
        <span aria-hidden="true">＋</span> Ajouter une voiture
      </button>
    </div>
  </header>

  <main>
    <section class="kpis" aria-label="Statistiques">
      <article class="kpi"><h2>Voitures</h2><p id="kpi-total" class="kpi-valeur">—</p><p class="kpi-note" id="kpi-total-note">&nbsp;</p></article>
      <article class="kpi"><h2>Puissance moyenne</h2><p class="kpi-valeur"><span id="kpi-puissance">—</span><small>ch</small></p><p class="kpi-note">tous modèles confondus</p></article>
      <article class="kpi"><h2>Prix moyen</h2><p class="kpi-valeur" id="kpi-prix">—</p><p class="kpi-note">prix indicatifs</p></article>
      <article class="kpi"><h2>Vitesse record</h2><p class="kpi-valeur"><span id="kpi-vmax">—</span><small>km/h</small></p><p class="kpi-note" id="kpi-vmax-note">&nbsp;</p></article>
    </section>

    <section class="repartition" aria-label="Répartition">
      <div class="repartition-bloc">
        <h3>Par énergie</h3>
        <div id="rep-energie" class="barres"></div>
      </div>
      <div class="repartition-bloc">
        <h3>Par catégorie</h3>
        <div id="rep-categorie" class="barres"></div>
      </div>
    </section>

    <section class="catalogue" aria-label="Catalogue">
      <form id="filtres" class="filtres" autocomplete="off">
        <label class="champ champ-recherche">
          <span class="sr-only">Rechercher</span>
          <input type="search" name="q" placeholder="Rechercher une marque ou un modèle…" />
        </label>
        <label class="champ"><span>Pays</span><select name="pays"><option value="">Tous</option></select></label>
        <label class="champ"><span>Catégorie</span><select name="categorie"><option value="">Toutes</option></select></label>
        <label class="champ"><span>Énergie</span><select name="energie"><option value="">Toutes</option></select></label>
        <label class="champ"><span>Puissance min.</span>
          <select name="puissance_min">
            <option value="">Toutes</option><option value="300">300 ch</option><option value="500">500 ch</option>
            <option value="700">700 ch</option><option value="1000">1 000 ch</option>
          </select>
        </label>
        <label class="champ"><span>Trier par</span>
          <select name="tri">
            <option value="-puissance_ch">Puissance ↓</option>
            <option value="zero_a_cent_s">0-100 km/h ↑</option>
            <option value="-vitesse_max_kmh">Vitesse max ↓</option>
            <option value="prix_eur">Prix ↑</option>
            <option value="-prix_eur">Prix ↓</option>
            <option value="-annee">Plus récentes</option>
            <option value="marque">Marque A→Z</option>
          </select>
        </label>
        <button type="button" id="btn-reinit" class="btn btn-lien">Réinitialiser</button>
      </form>

      <p id="resume" class="resume" aria-live="polite"></p>
      <div id="grille" class="grille"></div>
      <nav id="pagination" class="pagination" aria-label="Pagination"></nav>
    </section>
  </main>

  <!-- Fiche détail -->
  <dialog id="dlg-detail" class="dialogue">
    <div class="dialogue-tete">
      <div>
        <p class="detail-marque" id="detail-marque"></p>
        <h2 id="detail-modele"></h2>
      </div>
      <button class="btn-fermer" data-fermer aria-label="Fermer">✕</button>
    </div>
    <div id="detail-corps" class="detail-corps"></div>
    <div class="dialogue-pied">
      <button class="btn btn-danger" id="btn-supprimer" type="button">Supprimer</button>
      <button class="btn btn-secondaire" id="btn-modifier" type="button">Modifier</button>
    </div>
  </dialog>

  <!-- Formulaire ajout / modification -->
  <dialog id="dlg-form" class="dialogue dialogue-large">
    <form id="form-voiture" method="dialog" novalidate>
      <div class="dialogue-tete">
        <h2 id="form-titre">Ajouter une voiture</h2>
        <button class="btn-fermer" data-fermer type="button" aria-label="Fermer">✕</button>
      </div>
      <div class="form-corps">
        <fieldset>
          <legend>Identité</legend>
          <label class="champ"><span>Marque *</span><input name="marque" required /></label>
          <label class="champ"><span>Modèle *</span><input name="modele" required /></label>
          <label class="champ"><span>Année *</span><input name="annee" type="number" min="1886" max="2100" required /></label>
          <label class="champ"><span>Pays</span><input name="pays" list="liste-pays" /></label>
          <label class="champ"><span>Catégorie</span><input name="categorie" list="liste-categories" /></label>
          <label class="champ"><span>Places</span><input name="places" type="number" min="1" max="9" /></label>
          <label class="champ champ-case"><input name="en_production" type="checkbox" checked /><span>En production</span></label>
        </fieldset>
        <fieldset>
          <legend>Moteur</legend>
          <label class="champ"><span>Énergie</span>
            <select name="moteur.energie"><option value="">—</option><option>Essence</option><option>Hybride</option><option>Électrique</option><option>Diesel</option></select>
          </label>
          <label class="champ"><span>Architecture</span><input name="moteur.architecture" placeholder="V8 biturbo" /></label>
          <label class="champ"><span>Cylindrée (cm³)</span><input name="moteur.cylindree_cc" type="number" min="0" /></label>
          <label class="champ"><span>Puissance (ch) *</span><input name="moteur.puissance_ch" type="number" min="1" required /></label>
          <label class="champ"><span>Couple (Nm)</span><input name="moteur.couple_nm" type="number" min="0" /></label>
        </fieldset>
        <fieldset>
          <legend>Transmission &amp; performances</legend>
          <label class="champ"><span>Boîte</span><input name="transmission.boite" placeholder="Double embrayage" /></label>
          <label class="champ"><span>Rapports</span><input name="transmission.rapports" type="number" min="1" /></label>
          <label class="champ"><span>Transmission</span>
            <select name="transmission.type"><option value="">—</option><option>Propulsion</option><option>Traction</option><option>Intégrale</option></select>
          </label>
          <label class="champ"><span>0-100 km/h (s)</span><input name="performances.zero_a_cent_s" type="number" min="0" step="0.01" /></label>
          <label class="champ"><span>Vitesse max (km/h)</span><input name="performances.vitesse_max_kmh" type="number" min="0" /></label>
          <label class="champ"><span>Poids (kg)</span><input name="poids_kg" type="number" min="1" /></label>
          <label class="champ"><span>Prix (€)</span><input name="prix_eur" type="number" min="0" step="100" /></label>
        </fieldset>
        <p id="form-erreur" class="form-erreur" role="alert" hidden></p>
      </div>
      <div class="dialogue-pied">
        <button class="btn btn-lien" data-fermer type="button">Annuler</button>
        <button class="btn btn-primaire" id="btn-enregistrer" type="submit">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <datalist id="liste-pays"></datalist>
  <datalist id="liste-categories"></datalist>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
